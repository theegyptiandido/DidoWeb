<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DidoWeb - WebGL-style Demo</title>
    <style>
        html, body { margin: 0; height: 100%; background: #101014; color: #cfd3dc;
                     font-family: Segoe UI, system-ui, sans-serif; }
        #wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px; }
        h1 { font-size: 18px; font-weight: 600; margin: 6px 0 0; }
        canvas { background: #000; border: 1px solid #2a2d36; border-radius: 6px; }
        p { font-size: 13px; color: #8a90a0; margin: 0; }
    </style>
</head>
<body>
    <div id="wrap">
        <h1>DidoWeb &mdash; a mini WebGL</h1>
        <canvas id="c" width="800" height="600"></canvas>
        <p>Shaders &bull; buffers &bull; attributes &bull; uniforms &bull; drawElements</p>
    </div>
    <script src="didoweb.js"></script>
    <script src="demo.js"></script>
</body>
</html>
